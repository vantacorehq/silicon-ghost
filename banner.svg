<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#051405"/>
    </linearGradient>
    
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#00FF41"/>
      <stop offset="100%" stop-color="#006400"/>
    </linearGradient>

    <filter id="greenGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="circuit" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 0 25 L 25 25 L 35 15 L 50 15" fill="none" stroke="#003300" stroke-width="1"/>
      <path d="M 25 25 L 25 50" fill="none" stroke="#003300" stroke-width="1"/>
      <circle cx="25" cy="25" r="2" fill="#00FF41" opacity="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)"/>
  <rect width="1200" height="400" fill="url(#circuit)" opacity="0.6"/>
  
  <!-- CPU Die / Silicon Chip -->
  <g transform="translate(950, 200)">
    <rect x="-120" y="-120" width="240" height="240" fill="#050505" stroke="#00FF41" stroke-width="2" filter="url(#greenGlow)"/>
    <rect x="-80" y="-80" width="160" height="160" fill="#000000" stroke="#00FF41" stroke-width="1"/>
    <!-- Pins -->
    <line x1="-120" y1="-80" x2="-140" y2="-80" stroke="#00FF41" stroke-width="2"/>
    <line x1="-120" y1="-40" x2="-140" y2="-40" stroke="#00FF41" stroke-width="2"/>
    <line x1="-120" y1="0" x2="-140" y2="0" stroke="#00FF41" stroke-width="2"/>
    <line x1="-120" y1="40" x2="-140" y2="40" stroke="#00FF41" stroke-width="2"/>
    <line x1="-120" y1="80" x2="-140" y2="80" stroke="#00FF41" stroke-width="2"/>
    
    <!-- Inner Core (The Ghost) -->
    <circle cx="0" cy="0" r="30" fill="none" stroke="#FF0000" stroke-width="2" stroke-dasharray="5 5"/>
    <circle cx="0" cy="0" r="10" fill="#00FF41" filter="url(#greenGlow)"/>
  </g>

  <!-- Typography -->
  <text x="60" y="200" font-family="Courier New, monospace" font-size="90" font-weight="900" fill="url(#textGrad)" letter-spacing="5" filter="url(#greenGlow)">SILICON-GHOST</text>
  
  <text x="65" y="240" font-family="Courier New, monospace" font-size="18" fill="#00FF41" letter-spacing="4">RING -4 HARDWARE EXPLOIT</text>
  
  <!-- Terminal Data -->
  <g transform="translate(65, 280)">
    <rect x="0" y="0" width="650" height="1" fill="#00FF41" opacity="0.5"/>
    <text x="0" y="20" font-family="Courier New, monospace" font-size="12" fill="#FFFFFF" opacity="0.8">&gt; INTEL_ME_STATUS: <tspan fill="#FF0000">COMPROMISED</tspan></text>
    <text x="0" y="40" font-family="Courier New, monospace" font-size="12" fill="#FFFFFF" opacity="0.8">&gt; AMD_PSP_STATUS: <tspan fill="#FF0000">COMPROMISED</tspan></text>
    <text x="0" y="60" font-family="Courier New, monospace" font-size="12" fill="#FFFFFF" opacity="0.8">&gt; OS_AWARENESS: <tspan fill="#00FF41">ZERO</tspan></text>
  </g>
</svg>
